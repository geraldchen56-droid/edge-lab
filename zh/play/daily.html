<div class="game gx" id="game">
<section class="desk gx-card" id="gxIntro">

<h2 class="gx-title">十道题。<b>所有人相同。</b></h2>
<ul class="gx-rules">
<li>公允价值、底池赔率、ETF 套利、贝叶斯、凯利、诈唬等，每类一题。</li>
<li>每题 30 秒。可以按键盘 1–4 作答。</li>
<li>每答对一题 80 分，速度另加最多 200 分。满分 1,000。</li>
<li>每天一次排名机会。挑战在 UTC 00:00 重置。</li>
</ul>
<p class="gx-status" id="gxStatus"></p>
<p class="gx-streak" id="gxStreak"></p>
<div class="row"><button class="chip-btn" id="gxStart">开始</button><a class="tb-btn" data-nav="" href="leaderboard.html">排行榜</a></div>

<div class="gx-opts" id="gxOpts"></div>
